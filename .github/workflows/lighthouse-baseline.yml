name: Calcora Lighthouse baseline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/lighthouse-baseline.yml'
      - '**.html'
      - 'favicon.svg'

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Serve the pull request branch locally
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory . > /tmp/calcora-http.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
      - name: Measure representative pages
        run: |
          mkdir -p lighthouse-reports
          while IFS='|' read -r name url; do
            echo "Measuring $name: $url"
            npx --yes lighthouse@12.8.2 "$url" \
              --chrome-flags="--headless --no-sandbox" \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json \
              --output-path="lighthouse-reports/$name.json" \
              --quiet
          done <<'PAGES'
          home|http://127.0.0.1:4173/
          average|http://127.0.0.1:4173/calculators/grades/average.html
          learning-lab|http://127.0.0.1:4173/learning-lab.html
          finance|http://127.0.0.1:4173/calculators/finance/index.html
          PAGES
      - name: Add Lighthouse summary to workflow
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = 'lighthouse-reports';
          const files = fs.readdirSync(dir).filter(file => file.endsWith('.json')).sort();
          const score = value => value == null ? 'n/a' : Math.round(value * 100);
          const lines = [
            '## Lighthouse baseline',
            '',
            '| Page | Performance | Accessibility | Best practices | SEO | LCP | TBT | CLS |',
            '|---|---:|---:|---:|---:|---:|---:|---:|'
          ];
          for (const file of files) {
            const report = JSON.parse(fs.readFileSync(path.join(dir, file), 'utf8'));
            const c = report.categories || {};
            const a = report.audits || {};
            const page = path.basename(file, '.json');
            const seconds = id => a[id]?.numericValue == null ? 'n/a' : (a[id].numericValue / 1000).toFixed(2) + ' s';
            const ms = id => a[id]?.numericValue == null ? 'n/a' : Math.round(a[id].numericValue) + ' ms';
            const cls = a['cumulative-layout-shift']?.numericValue;
            lines.push('| ' + page + ' | ' + score(c.performance?.score) + ' | ' +
              score(c.accessibility?.score) + ' | ' + score(c['best-practices']?.score) + ' | ' +
              score(c.seo?.score) + ' | ' + seconds('largest-contentful-paint') + ' | ' +
              ms('total-blocking-time') + ' | ' + (cls == null ? 'n/a' : cls.toFixed(3)) + ' |');
          }
          lines.push('', 'Full JSON reports are attached as the `lighthouse-reports` artifact.');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          NODE
      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        with:
          name: calcora-lighthouse-baseline
          path: lighthouse-reports/*.json
          if-no-files-found: error
          retention-days: 14
