name: Deploy Calcora to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          find assets/js components locales settings -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run regression tests
        run: node --test tests/*.test.cjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Test published pages and key interactions in Chromium
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node tests/browser-smoke.cjs
      - name: Upload visual smoke-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calcora-learning-lab-visual-check
          path: artifacts/*.png
          if-no-files-found: ignore
