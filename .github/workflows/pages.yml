name: Deploy Calcora to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/discovery.js
          node --check assets/js/calculator-pages.js
          node --check assets/js/algeria-grades.js
          node --check assets/js/education-profile.js
          node --check assets/js/profile-pages.js
          node --check assets/js/lmd-calculator.js
          node --check assets/js/student-workspace.js
          node --check assets/js/university-planner.js
          node --check locales/en.js
          node --check locales/fr.js
          node --check locales/ar.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
