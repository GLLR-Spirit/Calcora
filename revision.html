<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free revision tools: create flashcards, practise quizzes and take timed self-tests."><title>Revision studio — Calcora</title><link rel="stylesheet" href="assets/css/base.css"><link rel="stylesheet" href="assets/css/theme-light.css" id="theme-stylesheet"><link rel="stylesheet" href="assets/css/revision.css"><script defer src="assets/js/revision.js"></script></head><body><header><a class="brand" href="index.html">◉ Calcora</a><nav><label for="language-select" data-t="locale">Language</label> <select id="language-select"><option value="en">English</option><option value="fr">Français</option><option value="ar">العربية</option></select> <button id="theme-toggle" type="button">☾</button></nav></header><main class="page revision-page"><p><a href="index.html" data-t="home">Home</a></p><h1 data-t="title">Revision studio</h1><div class="revision-tabs"><button type="button" data-tab="cards" aria-selected="true" data-t="cards">Flashcards</button><button type="button" data-tab="quiz" aria-selected="false" data-t="quiz">Quick quiz</button><button type="button" data-tab="exam" aria-selected="false" data-t="exam">Timed session</button></div><p id="status-message" role="status" aria-live="polite"></p><section data-panel="cards"><form id="card-form" class="revision-form"><label class="field"><span data-t="q">Question</span><textarea id="new-question" required rows="2"></textarea></label><label class="field"><span data-t="a">Answer</span><textarea id="new-answer" required rows="2"></textarea></label><label class="field"><span data-t="subject">Subject (optional)</span><select id="new-subject"><option value="" data-t="noSubject">No subject</option></select></label><button class="primary" data-t="add" type="submit">Add card</button></form><p data-t="saved">Saved locally</p><div class="revision-actions"><button id="export-cards" type="button" data-t="export">Export</button><label class="import-button"><span data-t="import">Import</span><input id="import-file" type="file" accept=".json,application/json"></label><button id="delete-all" type="button" data-t="del">Delete all</button></div><h3><span data-t="cards">Flashcards</span>: <span id="card-count">0</span></h3><div id="card-list"></div><div id="history-summary"></div></section><section data-panel="quiz" hidden><div id="quiz-setup"><p data-t="need">Add at least two cards.</p><button id="quiz-start" class="primary" type="button" data-t="start">Start</button></div><div id="quiz-play" hidden><p id="quiz-progress"></p><h3 id="quiz-question"></h3><label class="field"><span data-t="yourAnswer">Your answer</span><textarea id="quiz-answer" rows="3"></textarea></label><button id="quiz-check" type="button" class="primary" data-t="check">Check</button><p id="quiz-feedback" aria-live="polite"></p><button id="quiz-next" type="button" hidden data-t="next">Next</button></div><div id="quiz-result" hidden></div></section><section data-panel="exam" hidden><div id="exam-setup"><label class="field"><span data-t="duration">Duration (minutes)</span><input id="exam-minutes" type="number" min="1" max="180" value="10"></label><button id="exam-start" class="primary" type="button" data-t="start">Start</button></div><div id="exam-play" hidden><p><span data-t="time">Time left</span>: <strong id="exam-remaining">10:00</strong></p><p id="exam-progress"></p><h3 id="exam-question"></h3><label class="field"><span data-t="yourAnswer">Your answer</span><textarea id="exam-answer" rows="3"></textarea></label><button id="exam-next" type="button" class="primary" data-t="next">Next</button><button id="exam-submit" type="button" data-t="finish">Finish</button></div><div id="exam-result" hidden></div></section></main><footer><a href="index.html" data-t="home">Home</a><span>© Calcora</span></footer></body></html>
