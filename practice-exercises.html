<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Free interactive practice exercises for mathematics, physics and computer science, organized by school level with progressive hints and step-by-step corrections.">
<title>Practice exercises — Calcora</title>
<link rel="stylesheet" href="assets/css/base.css"><link rel="stylesheet" href="assets/css/theme-light.css" id="theme-stylesheet">
<style>
.exercise-page{max-width:900px;margin:auto;padding:34px 22px;min-height:65vh}.exercise-panel{padding:20px;border:1px solid var(--border);border-radius:16px;background:var(--surface);margin:16px 0}.exercise-filters{display:grid;grid-template-columns:1fr 1fr;gap:12px}.exercise-filters label{display:block}.exercise-filters select,.answer-input{display:block;width:100%;margin-top:6px}.exercise-meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:.9rem}.exercise-chip{padding:4px 9px;border-radius:999px;background:var(--soft)}.exercise-question{font-size:1.25rem;font-weight:700;margin:18px 0}.exercise-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.exercise-feedback,.exercise-hint,.exercise-solution{margin-top:14px;padding:14px;border-radius:12px;background:var(--soft)}.exercise-solution{white-space:pre-wrap}.exercise-muted{color:var(--muted)}@media(max-width:600px){.exercise-filters{grid-template-columns:1fr}.exercise-page{padding:24px 16px}}
</style>
</head>
<body>
<header><a class="brand" href="index.html">◉ Calcora</a><nav><label for="language-select" id="language-label">Language</label> <select id="language-select"><option value="en">English</option><option value="fr">Français</option><option value="ar">العربية</option></select> <button id="theme-toggle" type="button" aria-label="Toggle theme">☾</button></nav></header>
<main class="exercise-page">
<p><a href="index.html" id="home-link">← Home</a></p>
<p class="exercise-muted" id="eyebrow">PRACTISE • CHECK • UNDERSTAND</p><h1 id="page-title">Interactive practice exercises</h1><p id="intro">Choose a subject and level. Try the answer, reveal hints one by one, then study the worked correction.</p>
<section class="exercise-panel">
<div class="exercise-filters">
<label><span id="subject-label">Subject</span><select id="subject"><option value="all">All subjects</option><option value="math">Mathematics</option><option value="physics">Physics</option><option value="cs">Computer science</option></select></label>
<label><span id="level-label">Level</span><select id="level"><option value="all">All levels</option><option value="middle">Middle school</option><option value="high">High school</option><option value="bac">BAC / Baccalaureate</option><option value="university">University</option></select></label>
</div>
<p class="exercise-muted" id="count" aria-live="polite"></p>
<div class="exercise-meta"><span class="exercise-chip" id="subject-chip"></span><span class="exercise-chip" id="level-chip"></span><span class="exercise-chip" id="number-chip"></span></div>
<h2 class="exercise-question" id="question"></h2>
<label for="answer" id="answer-label">Your answer</label><input class="answer-input" id="answer" autocomplete="off" placeholder="Enter your answer">
<div class="exercise-actions"><button class="primary" id="check">Check answer</button><button id="hint">Show a hint</button><button id="solution">Show correction</button><button id="next">Next exercise →</button></div>
<div id="feedback" class="exercise-feedback" role="status" aria-live="polite" hidden></div>
<div id="hint-box" class="exercise-hint" aria-live="polite" hidden></div>
<div id="solution-box" class="exercise-solution" hidden></div>
</section>
<p class="exercise-muted" id="privacy-note">Free and local: answers are checked in your browser; no account or server is needed.</p>
</main><footer><a href="index.html" id="footer-home">Calcora</a><span>© Calcora</span></footer>

en:{home:"← Home",language:"Language",eyebrow:"PRACTISE • CHECK • UNDERSTAND",title:"Interactive practice exercises",intro:"Choose a subject and level. Try the answer, reveal hints one by one, then study the worked correction.",subject:"Subject",level:"Level",allSubjects:"All subjects",math:"Mathematics",physics:"Physics",cs:"Computer science",allLevels:"All levels",middle:"Middle school",high:"High school",bac:"BAC / Baccalaureate",university:"University",yourAnswer:"Your answer",placeholder:"Enter your answer",check:"Check answer",hint:"Show a hint",nextHint:"Show next hint",solution:"Show correction",next:"Next exercise →",count:"{n} exercises match your filters.",correct:"Correct! Good work.",incorrect:"Not quite. Recheck your calculation or reveal a hint.",empty:"No exercises match these filters yet. Try another level or subject.",hintProgress:"Hint {n} of {total}",noHints:"No more hints. Try solving it, then read the correction.",solutionTitle:"Worked correction",privacy:"Free and local: answers are checked in your browser; no account or server is needed.",answerRequired:"Enter an answer first.",number:"Exercise {n}",mathLabel:"Mathematics",physicsLabel:"Physics",csLabel:"Computer science"},

{id:"m2",s:"math",l:"middle",q:{en:"A rectangle is 8 cm long and 3 cm wide. What is its perimeter in cm?",fr:"Un rectangle mesure 8 cm sur 3 cm. Quel est son périmètre en cm ?",ar:"مستطيل طوله 8 سم وعرضه 3 سم. ما محيطه بالسنتيمتر؟"},a:["22","22cm","22 cm"],h:{en:["Perimeter is the sum of all sides.","Use P = 2 × (length + width)."],fr:["Le périmètre est la somme des côtés.","Utilise P = 2 × (longueur + largeur)."],ar:["المحيط هو مجموع أطوال الأضلاع.","استعمل P = 2 × (الطول + العرض)."]},c:{en:"P = 2 × (8 + 3) = 2 × 11 = 22 cm.",fr:"P = 2 × (8 + 3) = 2 × 11 = 22 cm.",ar:"P = 2 × (8 + 3) = 2 × 11 = 22 سم."}},
{id:"m3",s:"math",l:"high",q:{en:"Solve for x: 3x + 5 = 20. Enter x.",fr:"Résous : 3x + 5 = 20. Donne x.",ar:"حل المعادلة: 3x + 5 = 20. أوجد x."},a:["5"],h:{en:["Subtract 5 from both sides.","Then divide both sides by 3."],fr:["Soustrais 5 des deux côtés.","Puis divise les deux côtés par 3."],ar:["اطرح 5 من الطرفين.","ثم اقسم الطرفين على 3."]},c:{en:"3x + 5 = 20 → 3x = 15 → x = 15/3 = 5.",fr:"3x + 5 = 20 → 3x = 15 → x = 15/3 = 5.",ar:"3x + 5 = 20 ← نطرح 5 فنحصل على 3x = 15، ثم x = 15/3 = 5."}},

{id:"m5",s:"math",l:"university",q:{en:"Differentiate f(x) = x³ + 2x. What is f′(x)?",fr:"Dérive f(x) = x³ + 2x. Quelle est f′(x) ?",ar:"اشتق الدالة f(x) = x³ + 2x. ما هي f′(x)؟"},a:["3x^2+2","3x²+2","3*x^2+2","3x**2+2"],h:{en:["Use (xⁿ)′ = n xⁿ⁻¹.","Differentiate each term separately."],fr:["Utilise (xⁿ)′ = n xⁿ⁻¹.","Dérive chaque terme séparément."],ar:["استعمل (xⁿ)′ = n xⁿ⁻¹.","اشتق كل حد على حدة."]},c:{en:"(x³)′ = 3x² and (2x)′ = 2. Therefore f′(x) = 3x² + 2.",fr:"(x³)′ = 3x² et (2x)′ = 2. Donc f′(x) = 3x² + 2.",ar:"مشتقة x³ هي 3x² ومشتقة 2x هي 2، إذن f′(x) = 3x² + 2."}},
{id:"p1",s:"physics",l:"high",q:{en:"A cyclist travels 120 metres in 20 seconds. Find the average speed in m/s.",fr:"Un cycliste parcourt 120 mètres en 20 secondes. Calcule sa vitesse moyenne en m/s.",ar:"قطع درّاج 120 مترًا في 20 ثانية. احسب السرعة المتوسطة بالمتر/ثانية."},a:["6","6m/s","6 m/s"],h:{en:["Average speed = distance ÷ time.","Divide 120 by 20."],fr:["Vitesse moyenne = distance ÷ durée.","Divise 120 par 20."],ar:["السرعة المتوسطة = المسافة ÷ الزمن.","اقسم 120 على 20."]},c:{en:"v = d/t = 120/20 = 6 m/s.",fr:"v = d/t = 120/20 = 6 m/s.",ar:"v = d/t = 120/20 = 6 م/ث."}},
{id:"p2",s:"physics",l:"bac",q:{en:"A body speeds up from 4 m/s to 16 m/s in 3 s. Find acceleration in m/s².",fr:"Un mobile passe de 4 m/s à 16 m/s en 3 s. Calcule son accélération en m/s².",ar:"تغيّرت سرعة جسم من 4 إلى 16 م/ث خلال 3 ثوانٍ. احسب التسارع م/ث²."},a:["4","4m/s2","4 m/s²","4m/s²"],h:{en:["Acceleration = change in velocity ÷ time.","Use (16 − 4) ÷ 3."],fr:["Accélération = variation de vitesse ÷ durée.","Calcule (16 − 4) ÷ 3."],ar:["التسارع = تغير السرعة ÷ الزمن.","احسب (16 − 4) ÷ 3."]},c:{en:"a = (v₂ − v₁)/t = (16 − 4)/3 = 12/3 = 4 m/s².",fr:"a = (v₂ − v₁)/t = (16 − 4)/3 = 12/3 = 4 m/s².",ar:"a = (v₂ − v₁)/t = (16 − 4)/3 = 12/3 = 4 م/ث²."}},
{id:"p3",s:"physics",l:"university",q:{en:"A 2 kg object accelerates at 3 m/s². Find the net force in newtons.",fr:"Un objet de 2 kg accélère à 3 m/s². Calcule la force résultante en newtons.",ar:"جسم كتلته 2 كغ وتسارعه 3 م/ث². احسب القوة المحصلة بالنيوتن."},a:["6","6n","6 n"],h:{en:["Use Newton’s second law: F = m × a.","Multiply 2 kg by 3 m/s²."],fr:["Utilise la deuxième loi de Newton : F = m × a.","Multiplie 2 kg par 3 m/s²."],ar:["استعمل قانون نيوتن الثاني: F = m × a.","اضرب 2 كغ في 3 م/ث²."]},c:{en:"F = m × a = 2 × 3 = 6 N.",fr:"F = m × a = 2 × 3 = 6 N.",ar:"F = m × a = 2 × 3 = 6 نيوتن."}},

{id:"c2",s:"cs",l:"university",q:{en:"In C, how many times does this loop print a value? for (int i=0; i<4; i++)",fr:"En C, combien de fois cette boucle affiche-t-elle une valeur ? for (int i=0; i<4; i++)",ar:"في لغة C، كم مرة تطبع الحلقة قيمة؟ for (int i=0; i<4; i++)"},a:["4","four"],h:{en:["The counter starts at 0.","The loop runs while i is strictly less than 4."],fr:["Le compteur commence à 0.","La boucle continue tant que i est strictement inférieur à 4."],ar:["يبدأ العداد من 0.","تستمر الحلقة ما دام i أصغر تمامًا من 4."]},c:{en:"The counter values are 0, 1, 2 and 3. When i becomes 4, i < 4 is false. The loop runs 4 times.",fr:"تتخذ قيمة العداد القيم 0 و1 و2 و3. عندما تصبح i = 4 يصبح الشرط خاطئًا. إذن تتكرر الحلقة 4 مرات.",ar:"قيم العداد هي 0 و1 و2 و3. عند i = 4 يصبح الشرط i < 4 خاطئًا، لذا تتكرر الحلقة 4 مرات."}}
];
let lang="en", pool=[], current=null, hintIndex=0, index=0;
function t(k){return ui[lang][k]||ui.en[k]||k}
function normalize(s){return String(s||"").toLowerCase().replace(/[−–]/g,"-").replace(/²/g,"^2").replace(/³/g,"^3").replace(/\s+/g,"").replace(/,/g,".").replace(/(cm|m\/s²|m\/s2|m\/s|newtons?|n)$/g,"").replace(/×/g,"*")}
function isCorrect(value){const v=normalize(value);return current.a.some(a=>normalize(a)===v)}
function render(){
const s=$("subject").value,l=$("level").value;
pool=exercises.filter(e=>(s==="all"||e.s===s)&&(l==="all"||e.l===l));
$("count").textContent=pool.length?t("count").replace("{n}",pool.length):t("empty");
$("subject-chip").textContent=t(s==="all"?"allSubjects":s);
$("level-chip").textContent=t(l==="all"?"allLevels":l);
$("answer").value="";$("feedback").hidden=true;$("hint-box").hidden=true;$("solution-box").hidden=true;
if(!pool.length){current=null;$("question").textContent=t("empty");$("number-chip").textContent="";["answer","check","hint","solution","next"].forEach(id=>$(id).disabled=true);return}
["answer","check","hint","solution","next"].forEach(id=>$(id).disabled=false);
current=pool[index%pool.length];hintIndex=0;
$("question").textContent=current.q[lang];
$("number-chip").textContent=t("number").replace("{n}",index+1);
$("hint").textContent=t("hint");$("hint").disabled=false;
}
function setLang(next){lang=next;document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
const map={ "home-link":"home","footer-home":"home","language-label":"language","eyebrow":"eyebrow","page-title":"title","intro":"intro","subject-label":"subject","level-label":"level","answer-label":"yourAnswer","check":"check","hint":"hint","solution":"solution","next":"next","privacy-note":"privacy"};
Object.entries(map).forEach(([id,key])=>$(id).textContent=t(key));
$("answer").placeholder=t("placeholder");
$("subject").options[0].text=t("allSubjects");$("subject").options[1].text=t("math");$("subject").options[2].text=t("physics");$("subject").options[3].text=t("cs");
$("level").options[0].text=t("allLevels");$("level").options[1].text=t("middle");$("level").options[2].text=t("high");$("level").options[3].text=t("bac");$("level").options[4].text=t("university");
render();}
$("subject").addEventListener("change",()=>{index=0;render()});$("level").addEventListener("change",()=>{index=0;render()});
$("language-select").addEventListener("change",e=>setLang(e.target.value));
$("check").addEventListener("click",()=>{if(!current)return;if(!$("answer").value.trim()){$("feedback").textContent=t("answerRequired");$("feedback").hidden=false;return}$("feedback").textContent=isCorrect($("answer").value)?t("correct"):t("incorrect");$("feedback").hidden=false});
$("answer").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("check").click()}});
$("hint").addEventListener("click",()=>{if(!current)return;const hints=current.h[lang]||current.h.en; if(hintIndex>=hints.length){$("hint-box").textContent=t("noHints");$("hint").disabled=true;}else{$("hint-box").textContent=t("hintProgress").replace("{n}",hintIndex+1).replace("{total}",hints.length)+": "+hints[hintIndex++];$("hint").textContent=hintIndex<hints.length?t("nextHint"):t("noHints");if(hintIndex>=hints.length)$("hint").disabled=true;}$("hint-box").hidden=false});
$("solution").addEventListener("click",()=>{if(!current)return;$("solution-box").textContent=t("solutionTitle")+"\n"+current.c[lang];$("solution-box").hidden=false});
$("next").addEventListener("click",()=>{index=(index+1)%Math.max(pool.length,1);render()});
$("theme-toggle").addEventListener("click",()=>{const dark=document.documentElement.dataset.theme!=="dark";document.documentElement.dataset.theme=dark?"dark":"light";$("theme-stylesheet").href=dark?"assets/css/theme-dark.css":"assets/css/theme-light.css";$("theme-toggle").textContent=dark?"☀":"☾"});
setLang("en");
})();
</script>
</body></html>
